<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - MeuSite</title>
    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <form class="auth-form" method="POST" action="/cadastro">
            <h2>Criar Conta</h2>
            <div class="form-group">
                <label for="name">Nome Completo</label>
                <input type="text"
                       id="nome"
                       name="nome"
                       value="{{ nome or ''}}"
                       placeholder="Seu nome"
                       required>
            </div>
            <div class="form-group">
                <label for="email">E-mail</label>
                <input type="email"
                       id="email"
                       name="email"
                       value="{{ email or ''}}"
                       placeholder="Seu melhor e-mail"
                       required>
            </div>
            <div class="form-group">
                <label for="password">Senha</label>
                <small>
                    A senha deve possuir pelo menos 8 caracteres,
                    1 letra maiúscula e 1 número.
                </small>
                <input type="password" id="password" name="senha" minlenght="8" placeholder="Crie uma senha" required>

                {% if erro_senha %}
                    <p class="erro">{{ erro_senha }}</p>
                {% endif %}
            </div>
            <button type="submit" class="btn-primary">Cadastrar</button>
            <p>Já tem uma conta? <a href="/login">Faça login</a></p>
            <p><a href="/">Voltar para Home</a></p>
        </form>
    </div>
</body>
</html>
